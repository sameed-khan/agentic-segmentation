[project]
name = "probe3d-biomedparse"
version = "0.1.0"
description = "3D lesion-localizer probe: BiomedParse v2 (microsoft/BiomedParse branch v2) on MSTT-199 design cases"
requires-python = ">=3.10,<3.11"
dependencies = [
    # assets/requirements/inference.txt of the BiomedParse v2 repo (README-validated: torch 2.6.0 / torchvision 0.21.0)
    "numpy==1.26.4",
    "torch==2.6.0",          # PyPI wheel = cu124, supports sm_80 (A100)
    "torchvision==0.21.0",
    "hydra-core==1.3.2",
    "timm==0.9.16",
    "transformers==4.40.0",
    "fvcore==0.1.5.post20221221",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.23.0,<1.0",
    "pillow>=10.0",
    # runner extras (not in inference.txt)
    "nibabel>=5.2",
    "scipy>=1.11",
    "pynvml>=11.5",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
