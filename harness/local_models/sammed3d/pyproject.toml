[project]
name = "sammed3d"
version = "0.1.0"
description = "SAM-Med3D local segmenter service (Phase 6 segmenter swap): FastAPI session API mirroring the nnInteractive remote session methods segd calls."
requires-python = ">=3.11"
dependencies = [
    # Official README environment (SAM-Med3D readme.md "Usage"): torch 2.6.0 (+ companions),
    # torchio, monai, medim. torch 2.6.0 PyPI wheels are CUDA 12.4 builds (cu124) -> CUDA 12.x.
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torchio>=0.18.94",
    "monai>=1.3.0",
    "medim==0.1.2",
    "numpy>=2.0",
    "scipy>=1.11",
    "nibabel>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "requests>=2.34.2",
]

[project.scripts]
sammed3d-service = "sammed3d.service:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # signature-parity test compares SamMed3DSession against the real nnInteractive client
    "nninteractive-client>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sammed3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
