[project]
name = "segd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sameed Khan", email = "sameedgkhan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "blosc2>=4.14.1",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "nibabel>=5.4.2",
    "nninteractive-client>=2.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
segctl = "segd.segctl:main"
segd = "segd.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
